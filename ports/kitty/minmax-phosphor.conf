# minmax.nvim - Phosphor theme for Kitty
# Green-dominant terminal palette with restrained amber accents.
# Include this file from kitty.conf:
# include /absolute/path/to/minmax.nvim/ports/kitty/minmax-phosphor.conf

foreground #9acb78
background #090d08

cursor #c4e6a0
cursor_text_color #090d08

selection_foreground #c4e6a0
selection_background #344b32

url_color #79a85b

active_border_color #79a85b
inactive_border_color #344b32
bell_border_color #d97968

tab_bar_background #090d08
