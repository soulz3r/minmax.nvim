# minmax.nvim - Mono theme for Kitty
# Soft monochrome green terminal palette.
# Include this file from kitty.conf:
# include /absolute/path/to/minmax.nvim/ports/kitty/minmax-mono.conf

foreground #a6c5a8
background #080c09

cursor #e0f0df
cursor_text_color #080c09

selection_foreground #e0f0df
selection_background #354b3c

url_color #82a78a

active_border_color #82a78a
inactive_border_color #354b3c
bell_border_color #c9827b

tab_bar_background #080c09
active_tab_foreground #080c09
active_tab_background #82a78a
inactive_tab_foreground #587360
inactive_tab_background #354b3c

mark1_foreground #080c09
mark1_background #82a78a
mark2_foreground #080c09
mark2_background #c1b99b
mark3_foreground #080c09
mark3_background #c9827b

