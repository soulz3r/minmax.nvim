# minmax.nvim phosphor palette for Termux Launcher.
# Copy to ~/.termux/launcher-theme.properties, then run:
#   termux-reload-settings
#
# This themes the launcher interface. For terminal colours, also install
# minmax-phosphor.properties as ~/.termux/colors.properties.

surface                  = #090d08
surface_dim              = #070a06
surface_bright           = #263522
surface_container_lowest = #060906
surface_container_low    = #0c120a
surface_container        = #111a0e
surface_container_high   = #182315
surface_container_highest = #202d1b

on_surface               = #9acb78
on_surface_variant       = #829b72
outline                  = #526b46
outline_variant          = #293a25
scrollbar                = alpha(on_surface_variant, 0.3)

primary                  = #9acb78
on_primary               = #090d08
primary_container        = #24391d
on_primary_container     = #c4e6a0

secondary                = #79a85b
on_secondary             = #090d08
secondary_container      = #1a2a15
on_secondary_container   = #b6d69b

tertiary                 = #d6a45d
on_tertiary              = #090d08
tertiary_container       = #3a2b16
on_tertiary_container    = #efc477

error                    = #d97968
on_error                 = #090d08
error_container          = #3c1e19
on_error_container       = #ef9888

inverse_surface          = #c4e6a0
inverse_on_surface       = #090d08
inverse_primary          = #58734a
